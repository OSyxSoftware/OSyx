[package]
name = "osyx-win32"
description = "OSyx Windows runtime: runs PE32+ programs (winrun) with original ntdll/kernel32/user32/gdi32/ws2_32 implementations"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "winrun"
path = "src/main.rs"
test = false
bench = false

[dependencies]
os-std = { path = "../../runtime/os-std" }
os-sys = { path = "../../runtime/os-sys" }
osyx-abi = { path = "../../shared/abi" }
osyx-pe = { path = "../pe-parser" }
osyx-pe-loader = { path = "../pe-loader" }
osyx-gfx = { path = "../../boot/gfx" }
osyx-font = { path = "../../graphics/font" }
prism-client = { path = "../../graphics/prism-client" }
osyx-input = { path = "../../shared/input" }
osyx-crypto = { path = "../../shared/crypto" }
osyx-ui = { path = "../../graphics/ui" }
# CertGetCertificateChain: path building and signature checks against the
# Mozilla root store, with the RustCrypto verifiers osyx-web uses.
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
webpki-roots = "1"
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc"] }
# rustls-rustcrypto's key generation needs a source; winrun's is /dev/random.
getrandom = { version = "0.2", features = ["custom"] }
