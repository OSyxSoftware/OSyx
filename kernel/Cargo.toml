[package]
name = "osyx-kernel"
description = "The OSyx kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osyx-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
osyx-abi = { path = "../shared/abi" }
osyx-bootinfo = { path = "../shared/bootinfo" }
osyx-crypto = { path = "../shared/crypto" }
osyx-elf = { path = "../boot/elf" }
osyx-fat = { path = "../storage/fat" }
osyx-gfx = { path = "../boot/gfx" }
osyx-mm = { path = "mm" }
osyx-part = { path = "../storage/part" }
osyx-tmpfs = { path = "../storage/tmpfs" }
osyx-vfs = { path = "../storage/vfs" }
