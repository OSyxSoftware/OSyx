name: Bug report
description: Report a reproducible OSyx problem
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OSyx version, hardware or QEMU, and relevant logs with private data removed.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
