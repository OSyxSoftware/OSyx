[workspace]
resolver = "2"
members = [
    "shared/abi",
    "shared/bootinfo",
    "shared/crypto",
    "shared/input",
    "shared/update",
    "boot/gfx",
    "boot/elf",
    "boot/uefi-loader",
    "compatibility/pe-parser",
    "compatibility/pe-loader",
    "compatibility/win32",
    "kernel",
    "kernel/mm",
    "drivers/usb",
    "drivers/wireless",
    "graphics/prism-proto",
    "graphics/prism-core",
    "graphics/ui",
    "graphics/prism-client",
    "network/net",
    "runtime/os-sys",
    "runtime/os-std",
    "storage/ext4",
    "storage/fat",
    "storage/part",
    "storage/sevenz",
    "storage/tmpfs",
    "storage/vfs",
    "userspace/apps",
    "userspace/desktop",
    "userspace/install",
    "userspace/nettools",
    "userspace/web",
]
# Host-testable crates only. The loader, kernel and user programs are freestanding and are
# built with an explicit --target by scripts/build.ps1.
default-members = [
    "shared/abi",
    "shared/bootinfo",
    "shared/crypto",
    "shared/input",
    "shared/update",
    "boot/gfx",
    "boot/elf",
    "compatibility/pe-parser",
    "compatibility/pe-loader",
    "kernel/mm",
    "drivers/usb",
    "drivers/wireless",
    "graphics/prism-proto",
    "graphics/prism-core",
    "graphics/ui",
    "network/net",
    "runtime/os-sys",
    "runtime/os-std",
    "storage/ext4",
    "storage/fat",
    "storage/part",
    "storage/sevenz",
    "storage/tmpfs",
    "storage/vfs",
    "userspace/install",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["OSyx developers"]

[profile.release]
opt-level = 2
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"
